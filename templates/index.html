<!DOCTYPE html>
<html>
<head>
    <title>To-Do List App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            padding-top: 60px;
        }

        .container {
            background: #1f2937;
            width: 420px;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #8b5cf6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7c3aed;
        }

        .task {
            background: #374151;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete {
            color: #fca5a5;
            text-decoration: none;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <form method="POST">
            <input type="text" name="task" placeholder="Enter a task">
            <button type="submit">Add</button>
        </form>

        {% if todo_list %}
            {% for task in todo_list %}
                <div class="task">
                    <span>{{ loop.index }}. {{ task }}</span>
                    <a class="delete" href="/delete/{{ loop.index0 }}">Delete</a>
                </div>
            {% endfor %}
        {% else %}
            <p class="empty">Your to-do list is empty.</p>
        {% endif %}
    </div>
</body>
</html>
